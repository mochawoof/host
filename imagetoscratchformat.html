<!DOCTYPE html>
<html>
    <head>
        <title>Image to Scratch Format</title>
    </head>
    <body>
        <p><input type="file" id="image" multiple accept="image/*"></p>
        <p><canvas id="canvas"></canvas></p>
        <p><textarea id="textarea" style="white-space: nowrap;" cols="200"></textarea></p>
        <p>Length: <span id="len">0</span></p>
        <p><select id="mode">
            <option>12-bit</option>
            <!-- not implemented in scratch yet <option>8-bit</option> -->
        </select></p>
    </body>
    <script>
        let image = document.getElementById("image");
        let preview = document.createElement("img");
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");
        let textarea = document.getElementById("textarea");
        let len = document.getElementById("len");
        let mode = document.getElementById("mode");
        mode.value = "12-bit";
        image.value = "";
        textarea.value = "";

        // vga 13h
        let palette = [0x000000, 0x0000a8, 0x00a800, 0x00a8a8, 0xa80000, 0xa800a8, 0xa85400, 0xa8a8a8, 0x545454, 0x5454fc, 0x54fc54, 0x54fcfc, 0xfc5454, 0xfc54fc, 0xfcfc54, 0xfcfcfc, 0x000000, 0x141414, 0x202020, 0x2c2c2c, 0x383838, 0x444444, 0x505050, 0x606060, 0x707070, 0x808080, 0x909090, 0xa0a0a0, 0xb4b4b4, 0xc8c8c8, 0xe0e0e0, 0xfcfcfc, 0x0000fc, 0x4000fc, 0x7c00fc, 0xbc00fc, 0xfc00fc, 0xfc00bc, 0xfc007c, 0xfc0040, 0xfc0000, 0xfc4000, 0xfc7c00, 0xfcbc00, 0xfcfc00, 0xbcfc00, 0x7cfc00, 0x40fc00, 0x00fc00, 0x00fc40, 0x00fc7c, 0x00fcbc, 0x00fcfc, 0x00bcfc, 0x007cfc, 0x0040fc, 0x7c7cfc, 0x9c7cfc, 0xbc7cfc, 0xdc7cfc, 0xfc7cfc, 0xfc7cdc, 0xfc7cbc, 0xfc7c9c, 0xfc7c7c, 0xfc9c7c, 0xfcbc7c, 0xfcdc7c, 0xfcfc7c, 0xdcfc7c, 0xbcfc7c, 0x9cfc7c, 0x7cfc7c, 0x7cfc9c, 0x7cfcbc, 0x7cfcdc, 0x7cfcfc, 0x7cdcfc, 0x7cbcfc, 0x7c9cfc, 0xb4b4fc, 0xc4b4fc, 0xd8b4fc, 0xe8b4fc, 0xfcb4fc, 0xfcb4e8, 0xfcb4d8, 0xfcb4c4, 0xfcb4b4, 0xfcc4b4, 0xfcd8b4, 0xfce8b4, 0xfcfcb4, 0xe8fcb4, 0xd8fcb4, 0xc4fcb4, 0xb4fcb4, 0xb4fcc4, 0xb4fcd8, 0xb4fce8, 0xb4fcfc, 0xb4e8fc, 0xb4d8fc, 0xb4c4fc, 0x000070, 0x1c0070, 0x380070, 0x540070, 0x700070, 0x700054, 0x700038, 0x70001c, 0x700000, 0x701c00, 0x703800, 0x705400, 0x707000, 0x547000, 0x387000, 0x1c7000, 0x007000, 0x00701c, 0x007038, 0x007054, 0x007070, 0x005470, 0x003870, 0x001c70, 0x383870, 0x443870, 0x543870, 0x603870, 0x703870, 0x703860, 0x703854, 0x703844, 0x703838, 0x704438, 0x705438, 0x706038, 0x707038, 0x607038, 0x547038, 0x447038, 0x387038, 0x387044, 0x387054, 0x387060, 0x387070, 0x386070, 0x385470, 0x384470, 0x505070, 0x585070, 0x605070, 0x685070, 0x705070, 0x705068, 0x705060, 0x705058, 0x705050, 0x705850, 0x706050, 0x706850, 0x707050, 0x687050, 0x607050, 0x587050, 0x507050, 0x507058, 0x507060, 0x507068, 0x507070, 0x506870, 0x506070, 0x505870, 0x000040, 0x100040, 0x200040, 0x300040, 0x400040, 0x400030, 0x400020, 0x400010, 0x400000, 0x401000, 0x402000, 0x403000, 0x404000, 0x304000, 0x204000, 0x104000, 0x004000, 0x004010, 0x004020, 0x004030, 0x004040, 0x003040, 0x002040, 0x001040, 0x202040, 0x282040, 0x302040, 0x382040, 0x402040, 0x402038, 0x402030, 0x402028, 0x402020, 0x402820, 0x403020, 0x403820, 0x404020, 0x384020, 0x304020, 0x284020, 0x204020, 0x204028, 0x204030, 0x204038, 0x204040, 0x203840, 0x203040, 0x202840, 0x2c2c40, 0x302c40, 0x342c40, 0x3c2c40, 0x402c40, 0x402c3c, 0x402c34, 0x402c30, 0x402c2c, 0x40302c, 0x40342c, 0x403c2c, 0x40402c, 0x3c402c, 0x34402c, 0x30402c, 0x2c402c, 0x2c4030, 0x2c4034, 0x2c403c, 0x2c4040, 0x2c3c40, 0x2c3440, 0x2c3040, 0x000000, 0x000000, 0x000000, 0x000000, 0x000000, 0x000000, 0x000000, 0x000000];

        // returns as [h, s, v]
        function rgbToHsv(r, g, b) {
            let rc = r/255;
            let gc = g/255;
            let bc = b/255;

            let cMax = Math.max(rc, gc, bc);
            let cMin = Math.min(rc, gc, bc);
            let delta = cMax - cMin;

            let h = 0;
            if (delta == 0) {
                h = 0;
            } else if (cMax == rc) {
                h = 60 * (((gc - bc) / delta) % 6);
            } else if (cMax == gc) {
                h = 60 * (((bc - rc) / delta) + 2);
            } else {
                h = 60 * (((rc - gc) / delta) + 4);
            }

            if (h < 0) {
                h = 360 + h;
            }

            let s = 0;
            if (cMax != 0) {
                s = delta / cMax;
            }

            return [h, s, cMax];
        }

        // takes a single 16-bit color byte and converts it to 12-bit
        // returns number 0-255
        function processColor12Bit(color) {
            return Math.round(color / 17) * 17;
            //return parseInt(color.toString(16)[0] + color.toString(16)[0], 16); old method
        }

        // takes 3 16-bit color bytes and finds the closest match to the 8-bit color palette
        // returns array [palette index, [r, g, b]]
        // formula from https://en.wikipedia.org/wiki/Color_quantization
        function processColor8Bit(r, g, b) {
            //let rgbHsv = rgbToHsv(r, g, b);
            let distances = [];
            let rgbPalette = [];
            for (let i = 0; i < palette.length; i++) {
                let hex = palette[i].toString(16).padStart(6, 0);
                let pr = parseInt(hex[0] + hex[1], 16);
                let pg = parseInt(hex[2] + hex[3], 16);
                let pb = parseInt(hex[4] + hex[5], 16);
                rgbPalette.push([pr, pg, pb]);

                //let hexHsv = rgbToHsv(pr, pg, pb);
                // distance is [original index, dist]
                distances.push([i, Math.sqrt((r - pr) ** 2) + ((g - pg) ** 2) + ((b - pb) ** 2)]);
            }
            distances.sort((da, db) => {
                if (da[1] < db[1]) {
                    return -1;
                } else {
                    return 1;
                }
            })
            //console.log(rgbPalette[differences[0][0]]);
            return [distances[0][0], rgbPalette[distances[0][0]]];
        }

        function processFiles(files) {
            for (let i = 0; i < files.length; i++) {
                let f = files[i];
                if (f.type.startsWith("image/")) {
                    preview.onload = (e) => {
                        canvas.width = preview.width;
                        canvas.height = preview.height;

                        ctx.drawImage(preview, 0, 0);
                        let data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

                        let paletteIndexes = [];
                        if (mode.value == "12-bit") {
                            for (let i = 0; i < data.length; i++) {
                                data[i] = processColor12Bit(data[i]);
                            }
                        } else {
                            // 8-bit
                            for (let i = 0; i < data.length; i += 4) {
                                let color = processColor8Bit(data[i], data[i + 1], data[i + 2]);
                                data[i] = color[1][0];
                                paletteIndexes.push(color[0]);
                                data[i + 1] = color[1][1];
                                data[i + 2] = color[1][2];
                            }
                        }

                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.putImageData(new ImageData(data, canvas.width, canvas.height), 0, 0);
                        
                        let pixels = [];
                        for (let i = 0; i < data.length; i += 4) {
                            pixels.push([data[i], data[i + 1], data[i + 2]]);
                        }

                        let str = "";
                        if (mode.value == "12-bit") {
                            str += "T";
                        } else {
                            str += "E";
                        }
                        for (let i = 0; i < pixels.length; i++) {
                            let p = pixels[i];
                            
                            if (mode.value == "12-bit") {
                                str += p[0].toString(16)[0] + p[1].toString(16)[0] + p[2].toString(16)[0];
                            } else {
                                str += String.fromCharCode(paletteIndexes[i]);
                            }

                            if (i % canvas.width == 0 && i != 0) {
                                str += "-";
                            }
                        }
                        textarea.value += str + "\n";
                        len.innerText = str.length;
                    }
                    preview.src = URL.createObjectURL(f);
                }
            }
        }

        document.ondrop = (e) => {
            e.preventDefault();
            image.value = "";
            textarea.value = "";
            processFiles([...e.dataTransfer.items].map((item) => item.getAsFile()));
        }

        document.ondragover = (e) => {
            e.preventDefault();
        }

        image.oninput = (e) => {
            textarea.value = "";
            processFiles(image.files);
        }
    </script>
</html>
