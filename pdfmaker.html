        <p>You can make pdfs in a jiff</p>
        <p><input type="file" id="input" multiple></p>
        <p id="orderer"></p>
        <p>Order selected: <button id="up">Up</button> <button id="down">Down</button></p>
        <p><button id="downloadd">Download</button> <button id="clear">Clear</button></p>
        <p><select id="stretchMode">
            <option id="stretch">Stretch</option>
            <option id="fit">Fit</option>
            <option id="fitHeight">Fit height</option>
        </select></p>
        <p id="argsError"></p>
    </body>
    <script src="jspdf.umd.min.js"></script>
    <script>
        let input = document.querySelector("#input");
        let orderer = document.querySelector("#orderer");

        let up = document.querySelector("#up");
        let down = document.querySelector("#down");

        let downloadd = document.querySelector("#downloadd");
        let clear = document.querySelector("#clear");

        let stretchMode = document.querySelector("#stretchMode");
        let argsError = document.querySelector("#argsError");

        input.onchange = (e) => {
            for (let i = 0; i < input.files.length; i++) {
                let file = input.files[i];
                let filename = file.name;//.substring(0, file.name.lastIndexOf("."));

                let reader = new FileReader();
                reader.onload = (ev) => {
                    //reader.result
                    // replace file if already present
                    orderer.childNodes.forEach((n) => {
                        if (n.innerText.toLowerCase() == filename.toLowerCase()) {
                            n.remove();
                        }
                    });

                    let ordered = document.createElement("p");
                    ordered.innerText = filename;
                    ordered.classList.add("ordered");

                    ordered.onclick = (oe) => {
                        // if not holding ctrl or shift, clear all selections
                        if (!oe.ctrlKey && !oe.shiftKey) {
                            orderer.childNodes.forEach((n) => {
                                if (n.classList.contains("active")) {
                                    n.classList.remove("active");
                                }
                            });
                        }
                        if (ordered.classList.contains("active")) {
                            ordered.classList.remove("active");
                        } else {
                            ordered.classList.add("active");
                        }
                    }
                    
                    let oimg = document.createElement("img");
                    oimg.src = reader.result;
                    ordered.appendChild(oimg);

                    orderer.appendChild(ordered);
                }
                reader.readAsDataURL(file);
            }
        }
        input.onchange();

        up.onclick = (e) => {
            let toMove = [];
            orderer.childNodes.forEach((n) => {
                if (n.classList.contains("active")) {
                    toMove.unshift(n);
                }
            });
            toMove.forEach((n) => {
                n.remove();
                orderer.prepend(n);
            });
        }
        down.onclick = (e) => {
            let toMove = [];
            orderer.childNodes.forEach((n) => {
                if (n.classList.contains("active")) {
                    toMove.push(n);
                }
            });
            toMove.forEach((n) => {
                n.remove();
                orderer.appendChild(n);
            });
        }

        function getImg(src, cb) {
            let img = new Image();
            img.onload = () => {
                cb(img);
            };
            img.src = src;
        }

        downloadd.onclick = (e) => {
            argsError.innerText = "";
            if (orderer.childNodes.length > 0) {
                try {
                    getImg(orderer.childNodes[0].querySelector("img").src, (firstImg) => {
                        let pdf = new jspdf.jsPDF({
                            orientation: (firstImg.width > firstImg.height) ? "l" : "p",
                            unit: "px",
                            format: [firstImg.height, firstImg.width]
                        });
                        console.log(firstImg.width + ", " + firstImg.height);
                        let i = 0;
                        orderer.childNodes.forEach((n) => {
                            let img = n.querySelector("img");
                            if (img.complete) {
                                let fileext = img.src.substring(img.src.lastIndexOf(".") + 1);
                                if (i > 0) {
                                    pdf.addPage();
                                }
                                if (stretchMode.selectedOptions[0].id == "stretch") {
                                    pdf.addImage(img, fileext, 0, 0, firstImg.width, firstImg.height);
                                } else if (stretchMode.selectedOptions[0].id == "fit") {
                                    pdf.addImage(img, fileext, 0, 0, firstImg.width, firstImg.width * (img.height / img.width));
                                } else {
                                    pdf.addImage(img, fileext, 0, 0, firstImg.height * (img.width / img.height), firstImg.height);
                                }
                                i++;
                            }
                        });
                        pdf.save("pdf.pdf");
                    });
                } catch (err) {
                    argsError.innerText = err;
                }
            }
        }

        clear.onclick = (e) => {
            let toMove = [];
            orderer.childNodes.forEach((n) => {
                toMove.push(n);
            });
            toMove.forEach((n) => {
                n.remove();
            });
        }
    </script>
